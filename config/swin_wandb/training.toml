batch_size = 512
epochs = 200
device = "cuda"
epoch_to_save_model = 201
path_to_save_model = "model_weights_ADNI"
measure_metrics_during_training = true
print_var = true
seed = 161317666
wandb_training = true
log_freq = 1
debug = false
use_scheduler = true
project_name = "demnet_training_ADNI_2.5D"
model_artifact_name = "demnet_z_48"

[lr_scheduler_config]
name = "ChainedScheduler"

[lr_scheduler_config.list_config_schedulers.config_0]
name = "CosineAnnealingLR"
T_max = 5
eta_min = 1e-5

[lr_scheduler_config.list_config_schedulers.config_1]
name = "ExponentialLR"
gamma = 0.92
